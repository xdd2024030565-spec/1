<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网址储存</title>
<style>
:root{--bg:#fff;--bg2:#f5f5f7;--fg:#1a1a1a;--fg2:#86868b;--border:#d2d2d7;--accent:#0071e3;--accent-bg:rgba(0,113,227,.08);--danger:#ff3b30;--card:#f5f5f7;--nav-bg:rgba(255,255,255,.92);--radius:12px;--maxw:720px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000;--bg2:#1c1c1e;--fg:#f5f5f7;--fg2:#86868b;--border:#38383a;--accent:#0a84ff;--accent-bg:rgba(10,132,255,.15);--danger:#ff453a;--card:#1c1c1e;--nav-bg:rgba(0,0,0,.92)}}
:root[data-theme=dark]{--bg:#000;--bg2:#1c1c1e;--fg:#f5f5f7;--fg2:#86868b;--border:#38383a;--accent:#0a84ff;--accent-bg:rgba(10,132,255,.15);--danger:#ff453a;--card:#1c1c1e;--nav-bg:rgba(0,0,0,.92)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);line-height:1.6;max-width:var(--maxw);margin:0 auto;padding:20px 16px 100px;font-size:16px;-webkit-font-smoothing:antialiased}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.page-header h1{font-size:1.8rem;font-weight:700;letter-spacing:-.02em}
.header-btn{border:none;background:transparent;color:var(--fg2);font-size:1.2rem;cursor:pointer;padding:8px;border-radius:8px;font-family:inherit}
.header-btn:hover{color:var(--accent);background:var(--accent-bg)}
.search-bar{width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--bg2);color:var(--fg);font-size:1rem;margin-bottom:16px;transition:border-color .2s;font-family:inherit}
.search-bar:focus{outline:none;border-color:var(--accent)}
.cat-tabs{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;margin-bottom:16px;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{white-space:nowrap;padding:8px 16px;border:none;border-radius:20px;background:var(--bg2);color:var(--fg2);font-size:.9rem;font-weight:500;cursor:pointer;transition:all .2s;font-family:inherit}
.cat-tab.active{background:var(--accent);color:#fff}
.cat-tab-add{background:transparent;border:1px dashed var(--border)}
.section-header{font-size:.85rem;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em;margin:24px 0 12px}
.link-list{list-style:none}
.link-card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:10px}
.link-row{display:flex;align-items:flex-start;gap:14px}
.link-favicon{width:36px;height:36px;border-radius:8px;flex-shrink:0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:.95rem;font-weight:600;color:var(--fg2);overflow:hidden;position:relative}
.link-favicon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.link-info{flex:1;min-width:0}
.link-title{font-size:1.05rem;font-weight:600;word-break:break-word;margin-bottom:2px}
.link-meta{font-size:.82rem;color:var(--fg2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.link-meta a{color:var(--fg2);text-decoration:none}
.link-meta a:hover{color:var(--accent)}
.link-meta .dot{color:var(--border)}
.link-actions{display:flex;gap:4px;flex-shrink:0}
.link-actions button{border:none;background:transparent;color:var(--fg2);font-size:.85rem;padding:6px 10px;border-radius:8px;cursor:pointer;transition:all .15s;font-family:inherit}
.link-actions button:hover{color:var(--accent);background:var(--accent-bg)}
.link-actions button.danger:hover{color:var(--danger);background:rgba(255,59,48,.1)}
.edit-panel{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);display:none}
.edit-panel.active{display:block}
.edit-panel input,.edit-panel select,.edit-panel textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--fg);font-size:.95rem;margin-bottom:8px;font-family:inherit}
.edit-panel textarea{resize:vertical;min-height:60px}
.edit-actions{display:flex;gap:8px;margin-top:4px}
.btn-save{flex:1;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:.95rem;font-weight:600;cursor:pointer;font-family:inherit}
.btn-cancel{padding:12px 20px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--fg2);font-size:.95rem;cursor:pointer;font-family:inherit}
.add-form{display:flex;gap:8px;margin-bottom:20px}
.add-form input{flex:1;padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--bg2);color:var(--fg);font-size:1rem;font-family:inherit}
.add-form input:focus{outline:none;border-color:var(--accent)}
.add-form select{padding:14px 12px;border:1px solid var(--border);border-radius:12px;background:var(--bg2);color:var(--fg);font-size:.9rem;font-family:inherit;max-width:100px}
.add-form button{padding:14px 24px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
.add-form button:disabled{opacity:.5}
.empty-state{text-align:center;color:var(--fg2);font-size:.95rem;padding:60px 20px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--fg);color:var(--bg);padding:14px 20px;border-radius:12px;font-size:.9rem;display:flex;align-items:center;gap:16px;z-index:200;transition:transform .3s ease;max-width:90%;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast button{border:none;background:transparent;color:var(--accent);font-weight:600;cursor:pointer;font-size:.9rem;font-family:inherit}
.panel{display:none}.panel.active{display:block}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--maxw);display:flex;background:var(--nav-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);z-index:100}
.nav-btn{flex:1;border:none;background:transparent;color:var(--fg2);font-size:.8rem;padding:12px 4px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:color .2s;font-family:inherit}
.nav-btn:hover{color:var(--fg)}
.nav-btn.active{color:var(--accent);font-weight:600}
.nav-icon{font-size:1.4rem;line-height:1}
.settings-group{background:var(--card);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.setting-item{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.setting-item:last-child{border-bottom:none}
.setting-label{font-size:1rem;font-weight:500}
.setting-desc{font-size:.82rem;color:var(--fg2);margin-top:2px}
.setting-input{flex:1;max-width:200px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--fg);font-size:.95rem;font-family:inherit}
.theme-buttons{display:flex;gap:8px}
.theme-btn{padding:8px 16px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--fg2);font-size:.85rem;cursor:pointer;font-family:inherit;transition:all .2s}
.theme-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.action-btn{width:100%;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--fg);font-size:.95rem;font-weight:500;cursor:pointer;font-family:inherit;margin-bottom:8px;transition:all .2s}
.action-btn:hover{border-color:var(--accent);color:var(--accent)}
.cat-item{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.cat-item-info{flex:1}
.cat-item-name{font-size:1.05rem;font-weight:600}
.cat-item-count{font-size:.82rem;color:var(--fg2)}
.cat-item-actions{display:flex;gap:4px}
.cat-item-actions button{border:none;background:transparent;color:var(--fg2);font-size:.85rem;padding:6px 10px;border-radius:8px;cursor:pointer;font-family:inherit}
.cat-item-actions button:hover{color:var(--accent);background:var(--accent-bg)}
.status-msg{text-align:center;font-size:.9rem;color:var(--fg2);padding:12px 0}
.error-msg{color:var(--danger);font-size:.9rem;padding:12px 16px;background:rgba(255,59,48,.08);border-radius:var(--radius);margin-bottom:16px}
</style>
</head>
<body>

<div class="panel active" id="panel-links">
  <div class="page-header">
    <h1 id="siteTitle">网址储存</h1>
    <button class="header-btn" id="settingsLinkBtn">⚙</button>
  </div>
  <input type="text" class="search-bar" id="quickSearch" placeholder="搜索...">
  <div class="cat-tabs" id="catTabs"></div>
  <div id="errorBox" class="error-msg" style="display:none;"></div>
  <div id="status" class="status-msg" style="display:none;"></div>
  <div id="linkContainer"></div>
</div>

<div class="panel" id="panel-categories">
  <div class="page-header"><h1>分类管理</h1></div>
  <div class="add-form">
    <input type="text" id="newCatInput" placeholder="分类名称...">
    <button id="addCatBtn">添加</button>
  </div>
  <div id="catListContainer"></div>
</div>

<div class="panel" id="panel-search">
  <div class="page-header"><h1>搜索</h1></div>
  <input type="text" class="search-bar" id="searchInput" placeholder="输入关键词搜索...">
  <div id="searchResults"><div class="empty-state">输入关键词开始搜索</div></div>
</div>

<div class="panel" id="panel-settings">
  <div class="page-header"><h1>设置</h1></div>
  <div class="settings-group">
    <div class="setting-item">
      <div><div class="setting-label">网站名称</div><div class="setting-desc">显示在页面顶部</div></div>
      <input type="text" class="setting-input" id="siteNameInput">
    </div>
  </div>
  <div class="settings-group">
    <div class="setting-item">
      <div><div class="setting-label">主题</div><div class="setting-desc">选择外观主题</div></div>
      <div class="theme-buttons">
        <button class="theme-btn" id="themeLight">亮色</button>
        <button class="theme-btn" id="themeDark">暗色</button>
        <button class="theme-btn" id="themeAuto">跟随系统</button>
      </div>
    </div>
  </div>
  <button class="action-btn" id="exportBtn">导出为 JSON 文件</button>
  <input type="file" id="importFile" accept=".json" style="display:none;">
  <button class="action-btn" id="importBtn">从 JSON 文件导入</button>
</div>

<div class="toast" id="toast">
  <span id="toastMsg"></span>
  <button id="toastBtn">撤销</button>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" data-panel="panel-links"><span class="nav-icon">☰</span><span>网址</span></button>
  <button class="nav-btn" data-panel="panel-categories"><span class="nav-icon">▢</span><span>分类</span></button>
  <button class="nav-btn" data-panel="panel-search"><span class="nav-icon">⌕</span><span>搜索</span></button>
  <button class="nav-btn" data-panel="panel-settings"><span class="nav-icon">⚙</span><span>设置</span></button>
</nav>

<script>
(function() {
  "use strict";
  var OWNER = "xdd2024030565-spec";
  var REPO = "1";
  var BRANCH = "main";
  var FILE_PATH = "links.json";
  var API_BASE = "https://api.yongjiu.ccwu.cc";
  var S = { siteName:"网址储存", settings:{theme:"auto"}, categories:[{id:"default",name:"常用"}], links:[], curCat:"all", searchQ:"", fileSha:null, busy:false, undoCb:null };

  function $(id) { return document.getElementById(id); }
  function gid() { return Date.now().toString(36) + Math.random().toString(36).substr(2,5); }
  function getDomain(u) { try { return new URL(u).hostname.replace(/^www\./,""); } catch(e) { return u; } }
  function getFavUrl(u) { return "https://www.google.com/s2/favicons?domain=" + getDomain(u) + "&sz=64"; }
  function getLetter(t) { return String(t||"?").charAt(0).toUpperCase(); }
  function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
  function timeAgo(d) { var days=Math.floor((new Date()-new Date(d))/864e5); if(days===0)return"今天"; if(days===1)return"昨天"; if(days<7)return days+"天前"; if(days<30)return Math.floor(days/7)+"周前"; return Math.floor(days/30)+"个月前"; }
  function getTGroup(d) { var days=Math.floor((new Date()-new Date(d))/864e5); if(days===0)return"today"; if(days<7)return"week"; return"earlier"; }
  function showStatus(m) { var e=$("status"); e.textContent=m; e.style.display="block"; }
  function hideStatus() { $("status").style.display="none"; }
  function showError(m) { var e=$("errorBox"); e.textContent=m; e.style.display="block"; }
  function clearError() { $("errorBox").style.display="none"; }

  function showToast(msg, btnText, cb) {
    var t=$("toast"), b=$("toastBtn");
    $("toastMsg").textContent=msg;
    if(btnText&&cb) { b.style.display="inline"; b.textContent=btnText; S.undoCb=cb; } else { b.style.display="none"; S.undoCb=null; }
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); S.undoCb=null; }, cb?4000:2000);
  }

  function ghReq(m,p,b) {
    var opts={method:m, headers:{Accept:"application/vnd.github.v3+json"}};
    if(b) opts.body=JSON.stringify(b);
    return fetch(API_BASE+p, opts).then(function(res){
      if(!res.ok) return res.json().catch(function(){return{}}).then(function(e){ throw new Error(e.message||res.status+" "+res.statusText); });
      if(res.status===204) return null;
      return res.json();
    });
  }

  function loadData() {
    showStatus("加载中...");
    clearError();
    ghReq("GET", "/repos/"+OWNER+"/"+REPO+"/contents/"+FILE_PATH+"?ref="+BRANCH)
      .then(function(d){
        S.fileSha=d.sha;
        if(d.content && d.encoding==="base64") {
          var p=JSON.parse(atob(d.content.replace(/\n/g,"")));
          if(Array.isArray(p)) {
            S.links=p.map(function(i){ return {id:gid(), url:i.url, title:i.title||i.url, categoryId:"default", note:"", pinned:false, added:i.added||new Date().toISOString()}; });
          } else {
            S.siteName=p.siteName||"网址储存";
            S.settings=p.settings||{theme:"auto"};
            S.categories=p.categories||[{id:"default",name:"常用"}];
            S.links=p.links||[];
          }
        }
        var st=localStorage.getItem("theme");
        if(st) S.settings.theme=st;
        S.curCat=localStorage.getItem("lastCat")||"all";
        if(!S.categories.length) S.categories=[{id:"default",name:"常用"}];
        hideStatus(); applyTheme(); updTitle(); renderAll();
      })
      .catch(function(e){
        S.fileSha=null;
        hideStatus();
        if(e.message && e.message.indexOf("404")!==-1) { /* file doesn't exist yet */ }
        else { showError("加载失败: "+e.message); }
        applyTheme(); updTitle(); renderAll();
      });
  }

  function saveData() {
    showStatus("保存中...");
    clearError();
    var content=btoa(unescape(encodeURIComponent(JSON.stringify({siteName:S.siteName, settings:S.settings, categories:S.categories, links:S.links}, null, 2))));
    var body={message:"更新数据", content:content, branch:BRANCH};
    if(S.fileSha) body.sha=S.fileSha;
    return ghReq("PUT", "/repos/"+OWNER+"/"+REPO+"/contents/"+FILE_PATH, body)
      .then(function(d){ S.fileSha=d.content?d.content.sha:S.fileSha; hideStatus(); })
      .catch(function(e){ hideStatus(); showError("保存失败: "+e.message); throw e; });
  }

  function applyTheme() {
    var t=S.settings.theme||"auto";
    document.documentElement.setAttribute("data-theme", t);
    localStorage.setItem("theme", t);
    ["Light","Dark","Auto"].forEach(function(n){ var b=$("theme"+n); if(b) b.classList.remove("active"); });
    var map={light:"Light", dark:"Dark", auto:"Auto"};
    var btn=$("theme"+map[t]);
    if(btn) btn.classList.add("active");
  }

  function updTitle() {
    $("siteTitle").textContent=S.siteName;
    document.title=S.siteName;
    var i=$("siteNameInput");
    if(i) i.value=S.siteName;
  }

  function renderAll() { renderCatTabs(); renderLinks(); renderCatList(); renderSettings(); }

  function renderCatTabs() {
    var c=$("catTabs");
    var h='<button class="cat-tab'+(S.curCat==="all"?" active":"")+'" data-act="selcat" data-id="all">全部('+S.links.length+')</button>';
    S.categories.forEach(function(cat){
      var cnt=S.links.filter(function(l){ return l.categoryId===cat.id; }).length;
      h+='<button class="cat-tab'+(S.curCat===cat.id?" active":"")+'" data-act="selcat" data-id="'+cat.id+'">'+esc(cat.name)+'('+cnt+')</button>';
    });
    h+='<button class="cat-tab cat-tab-add" data-act="newcat">+ 新建</button>';
    c.innerHTML=h;
  }

  function getFiltered() {
    var l=S.links;
    if(S.curCat!=="all") l=l.filter(function(x){ return x.categoryId===S.curCat; });
    if(S.searchQ) {
      var q=S.searchQ;
      l=l.filter(function(x){ return (x.title||"").toLowerCase().indexOf(q)!==-1 || (x.url||"").toLowerCase().indexOf(q)!==-1 || (x.note||"").toLowerCase().indexOf(q)!==-1; });
    }
    return l;
  }

  function renderLinks() {
    var c=$("linkContainer");
    var links=getFiltered();
    var h="";
    if(links.length===0) {
      h+='<div class="empty-state">'+(S.searchQ?"没有匹配的网址":"还没有网址，在下方添加吧")+'</div>';
    } else {
      var pin=links.filter(function(l){ return l.pinned; });
      var unpin=links.filter(function(l){ return !l.pinned; });
      var grps={today:[],week:[],earlier:[]};
      unpin.forEach(function(l){ grps[getTGroup(l.added)].push(l); });
      if(pin.length>0) {
        h+='<div class="section-header">置顶</div><ul class="link-list">';
        pin.forEach(function(l){ h+=renderCard(l); });
        h+='</ul>';
      }
      var gl={today:"今天", week:"本周", earlier:"更早"};
      for(var k in grps) {
        if(grps[k].length>0) {
          h+='<div class="section-header">'+gl[k]+'</div><ul class="link-list">';
          grps[k].forEach(function(l){ h+=renderCard(l); });
          h+='</ul>';
        }
      }
    }
    var last=localStorage.getItem("lastAddCat")||"default";
    h+='<div class="add-form" style="margin-top:24px;">';
    h+='<input type="text" id="urlInput" placeholder="粘贴网址，自动获取标题..." autocomplete="off">';
    h+='<select id="addCatSel">';
    S.categories.forEach(function(c2){ h+='<option value="'+c2.id+'"'+(c2.id===last?" selected":"")+'>'+esc(c2.name)+'</option>'; });
    h+='</select>';
    h+='<button id="addBtn">添加</button>';
    h+='</div>';
    c.innerHTML=h;
    var addBtn=$("addBtn");
    var urlInput=$("urlInput");
    if(addBtn) addBtn.onclick=function(){ addLink(); };
    if(urlInput) urlInput.onkeypress=function(e){ if(e.key==="Enter") addLink(); };
  }

  function renderCard(l) {
    var cat=S.categories.find(function(c){ return c.id===l.categoryId; });
    var cn=cat?cat.name:"未分类";
    var dom=getDomain(l.url);
    var ts=timeAgo(l.added);
    var lt=getLetter(l.title);
    var fu=getFavUrl(l.url);
    var h='<li class="link-card">';
    h+='<div class="link-row">';
    h+='<div class="link-favicon">'+esc(lt)+'<img src="'+fu+'" loading="lazy" onerror="this.remove()"></div>';
    h+='<div class="link-info"><div class="link-title">'+esc(l.title)+'</div><div class="link-meta">';
    h+='<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(dom)+'</a>';
    h+='<span class="dot">·</span><span>'+esc(cn)+'</span>';
    h+='<span class="dot">·</span><span>'+ts+'</span>';
    if(l.note) h+='<span class="dot">·</span><span>'+esc(l.note)+'</span>';
    h+='</div></div>';
    h+='<div class="link-actions">';
    h+='<button data-act="pin" data-id="'+l.id+'">'+(l.pinned?"取消置顶":"置顶")+'</button>';
    h+='<button data-act="edit" data-id="'+l.id+'">编辑</button>';
    h+='<button class="danger" data-act="del" data-id="'+l.id+'">删除</button>';
    h+='</div></div>';
    h+='<div class="edit-panel" id="edit-'+l.id+'">';
    h+='<input type="text" id="et-'+l.id+'" value="'+esc(l.title)+'" placeholder="标题">';
    h+='<input type="text" id="eu-'+l.id+'" value="'+esc(l.url)+'" placeholder="网址">';
    h+='<select id="ec-'+l.id+'">';
    S.categories.forEach(function(c){ h+='<option value="'+c.id+'"'+(c.id===l.categoryId?" selected":"")+'>'+esc(c.name)+'</option>'; });
    h+='</select>';
    h+='<textarea id="en-'+l.id+'" placeholder="备注（可选）">'+esc(l.note||"")+'</textarea>';
    h+='<div class="edit-actions">';
    h+='<button class="btn-save" data-act="save" data-id="'+l.id+'">完成</button>';
    h+='<button class="btn-cancel" data-act="canceledit" data-id="'+l.id+'">取消</button>';
    h+='</div></div></li>';
    return h;
  }

  function renderCatList() {
    var c=$("catListContainer");
    if(!c) return;
    if(S.categories.length===0) { c.innerHTML='<div class="empty-state">还没有分类</div>'; return; }
    var h="";
    S.categories.forEach(function(cat){
      var cnt=S.links.filter(function(l){ return l.categoryId===cat.id; }).length;
      h+='<div class="cat-item">';
      h+='<div class="cat-item-info"><div class="cat-item-name">'+esc(cat.name)+'</div><div class="cat-item-count">'+cnt+' 个链接</div></div>';
      h+='<div class="cat-item-actions">';
      h+='<button data-act="rencat" data-id="'+cat.id+'">重命名</button>';
      h+='<button class="danger" data-act="delcat" data-id="'+cat.id+'">删除</button>';
      h+='</div></div>';
    });
    c.innerHTML=h;
  }

  function renderSettings() {
    var i=$("siteNameInput");
    if(i) i.value=S.siteName;
    applyTheme();
  }

  function addLink() {
    if(S.busy) return;
    var inp=$("urlInput"), sel=$("addCatSel");
    if(!inp) return;
    var ru=inp.value.trim();
    if(!ru) return;
    var u=ru;
    if(!/^https?:\/\//.test(u)) u="https://"+u;
    var cid=sel?sel.value:"default";
    localStorage.setItem("lastAddCat", cid);
    S.busy=true;
    var btn=$("addBtn");
    if(btn) { btn.disabled=true; btn.textContent="获取中..."; }
    showStatus("正在获取标题...");
    fetchTitle(u).then(function(t){
      hideStatus();
      S.links.unshift({id:gid(), url:u, title:t||u, categoryId:cid, note:"", pinned:false, added:new Date().toISOString()});
      if(btn) btn.textContent="保存中...";
      return saveData().then(function(){
        renderAll();
        inp.value="";
        if(btn) { btn.textContent="添加"; btn.disabled=false; }
        S.busy=false;
      });
    }).catch(function(){
      hideStatus();
      if(btn) { btn.textContent="添加"; btn.disabled=false; }
      S.busy=false;
    });
  }

  function fetchTitle(u) {
    return fetch("https://corsproxy.io/?url="+encodeURIComponent(u))
      .then(function(r){ return r.text(); })
      .then(function(h){ var m=h.match(/<title[^>]*>([^<]*)<\/title>/i); return m?m[1].trim():""; })
      .catch(function(){ return ""; });
  }

  function toggleEdit(id) {
    var p=$("edit-"+id);
    if(!p) return;
    if(p.classList.contains("active")) p.classList.remove("active");
    else {
      document.querySelectorAll(".edit-panel.active").forEach(function(x){ x.classList.remove("active"); });
      p.classList.add("active");
    }
  }

  function saveEdit(id) {
    var l=S.links.find(function(x){ return x.id===id; });
    if(!l) return;
    var t=$("et-"+id).value.trim();
    var u=$("eu-"+id).value.trim();
    var c=$("ec-"+id).value;
    var n=$("en-"+id).value.trim();
    if(!t||!u) return;
    if(!/^https?:\/\//.test(u)) u="https://"+u;
    l.title=t; l.url=u; l.categoryId=c; l.note=n;
    saveData().then(function(){ renderAll(); });
  }

  function deleteLink(id) {
    var i=S.links.findIndex(function(x){ return x.id===id; });
    if(i===-1) return;
    var del=S.links.splice(i,1)[0];
    var idx=i;
    renderAll();
    saveData();
    showToast("已删除","撤销",function(){
      S.links.splice(idx,0,del);
      renderAll();
      saveData();
    });
  }

  function togglePin(id) {
    var l=S.links.find(function(x){ return x.id===id; });
    if(!l) return;
    l.pinned=!l.pinned;
    renderAll();
    saveData();
  }

  function addCategory() {
    var i=$("newCatInput");
    if(!i) return;
    var n=i.value.trim();
    if(!n) return;
    S.categories.push({id:gid(), name:n});
    i.value="";
    saveData().then(function(){ renderAll(); });
  }

  function deleteCategory(id) {
    if(S.categories.length<=1) { showToast("至少保留一个分类", null, null); return; }
    var def=S.categories.find(function(c){ return c.id!==id; });
    var cnt=S.links.filter(function(l){ return l.categoryId===id; }).length;
    S.links.forEach(function(l){ if(l.categoryId===id) l.categoryId=def.id; });
    S.categories=S.categories.filter(function(c){ return c.id!==id; });
    if(S.curCat===id) S.curCat="all";
    saveData().then(function(){ renderAll(); if(cnt>0) showToast(cnt+"个链接已移至"+def.name, null, null); });
  }

  function exportData() {
    var d={siteName:S.siteName, settings:S.settings, categories:S.categories, links:S.links};
    var b=new Blob([JSON.stringify(d,null,2)], {type:"application/json"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(b);
    a.download="网址备份_"+new Date().toISOString().slice(0,10)+".json";
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function importData(ev) {
    var f=ev.target.files[0];
    if(!f) return;
    var r=new FileReader();
    r.onload=function(e){
      try {
        var d=JSON.parse(e.target.result);
        if(d.siteName) S.siteName=d.siteName;
        if(d.settings) S.settings=d.settings;
        if(d.categories) S.categories=d.categories;
        if(d.links) S.links=d.links;
        saveData().then(function(){ renderAll(); showToast("导入成功", null, null); });
      } catch(err) { showError("导入失败: 文件格式错误"); }
    };
    r.readAsText(f);
  }

  // ===== Global =====
  window.switchPanel=function(id){
    document.querySelectorAll(".panel").forEach(function(p){ p.classList.toggle("active", p.id===id); });
    document.querySelectorAll(".nav-btn").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-panel")===id); });
    localStorage.setItem("active_panel", id);
  };
  window.undoAction=function(){ if(S.undoCb){ S.undoCb(); S.undoCb=null; $("toast").classList.remove("show"); } };
  window.handleQuickSearch=function(v){ S.searchQ=v.trim().toLowerCase(); renderLinks(); };
  window.handleSearch=function(v){
    var c=$("searchResults"), q=v.trim().toLowerCase();
    if(!q) { c.innerHTML='<div class="empty-state">输入关键词开始搜索</div>'; return; }
    var r=S.links.filter(function(l){ return (l.title||"").toLowerCase().indexOf(q)!==-1 || (l.url||"").toLowerCase().indexOf(q)!==-1 || (l.note||"").toLowerCase().indexOf(q)!==-1; });
    if(r.length===0) { c.innerHTML='<div class="empty-state">没有找到匹配的网址</div>'; return; }
    var h='<ul class="link-list">';
    r.forEach(function(l){ h+=renderCard(l); });
    h+='</ul>';
    c.innerHTML=h;
  };

  // ===== Event delegation for dynamic buttons =====
  document.addEventListener("click", function(e){
    var btn=e.target.closest("button");
    if(!btn) return;
    var act=btn.getAttribute("data-act");
    var id=btn.getAttribute("data-id");
    if(!act) return;
    if(act==="selcat") { S.curCat=id; localStorage.setItem("lastCat", id); renderCatTabs(); renderLinks(); }
    else if(act==="newcat") { window.switchPanel("panel-categories"); $("newCatInput").focus(); }
    else if(act==="pin") togglePin(id);
    else if(act==="edit") toggleEdit(id);
    else if(act==="del") deleteLink(id);
    else if(act==="save") saveEdit(id);
    else if(act==="canceledit") toggleEdit(id);
    else if(act==="rencat") {
      var cat=S.categories.find(function(c){ return c.id===id; });
      if(!cat) return;
      var nn=prompt("重命名分类", cat.name);
      if(nn && nn.trim()) { cat.name=nn.trim(); saveData().then(function(){ renderAll(); }); }
    }
    else if(act==="delcat") deleteCategory(id);
  });

  // ===== Static element events =====
  document.querySelectorAll(".nav-btn").forEach(function(btn){
    btn.onclick=function(){ window.switchPanel(btn.getAttribute("data-panel")); };
  });
  var slb=$("settingsLinkBtn");
  if(slb) slb.onclick=function(){ window.switchPanel("panel-settings"); };
  var sni=$("siteNameInput");
  if(sni) {
    sni.onblur=function(){ var n=this.value.trim(); if(n && n!==S.siteName){ S.siteName=n; updTitle(); saveData(); } };
    sni.onkeypress=function(e){ if(e.key==="Enter") this.blur(); };
  }
  var tl=$("themeLight"); if(tl) tl.onclick=function(){ S.settings.theme="light"; applyTheme(); saveData(); };
  var td=$("themeDark"); if(td) td.onclick=function(){ S.settings.theme="dark"; applyTheme(); saveData(); };
  var ta=$("themeAuto"); if(ta) ta.onclick=function(){ S.settings.theme="auto"; applyTheme(); saveData(); };
  var acb=$("addCatBtn"); if(acb) acb.onclick=addCategory;
  var nci=$("newCatInput"); if(nci) nci.onkeypress=function(e){ if(e.key==="Enter") addCategory(); };
  var eb=$("exportBtn"); if(eb) eb.onclick=exportData;
  var ib=$("importBtn"); if(ib) ib.onclick=function(){ $("importFile").click(); };
  var imf=$("importFile"); if(imf) imf.onchange=importData;
  var tb=$("toastBtn"); if(tb) tb.onclick=function(){ window.undoAction(); };
  var qs=$("quickSearch"); if(qs) qs.oninput=function(){ window.handleQuickSearch(this.value); };
  var si=$("searchInput"); if(si) si.oninput=function(){ window.handleSearch(this.value); };

  // ===== Init =====
  var sp=localStorage.getItem("active_panel");
  if(sp) window.switchPanel(sp);
  loadData();
})();
</script>
</body>
</html>
