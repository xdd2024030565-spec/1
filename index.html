<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网址储存</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --danger: #dc2626;
    --danger-hover: #b91c1c;
    --card-bg: #f9fafb;
    --radius: 6px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827;
      --fg: #f3f4f6;
      --muted: #9ca3af;
      --border: #374151;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --danger: #ef4444;
      --danger-hover: #f87171;
      --card-bg: #1f2937;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.6;
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 24px;
  }

  .settings {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 24px;
    background: var(--card-bg);
  }
  .settings summary {
    cursor: pointer;
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--muted);
    user-select: none;
  }
  .settings-body { margin-top: 14px; }
  .settings-body label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 4px;
    margin-top: 10px;
  }
  .settings-body input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--fg);
    font-size: 0.85rem;
    font-family: monospace;
  }
  .settings-body input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .settings-hint {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 6px;
    line-height: 1.5;
  }
  .settings-hint a {
    color: var(--accent);
    text-decoration: none;
  }

  .add-form {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .add-form input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--fg);
    font-size: 0.9rem;
  }
  .add-form input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .add-form button {
    padding: 10px 20px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .add-form button:hover { background: var(--accent-hover); }
  .add-form button:disabled { opacity: 0.5; cursor: not-allowed; }

  .link-list { list-style: none; }
  .link-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 8px;
    background: var(--card-bg);
    transition: border-color 0.15s;
  }
  .link-item:hover { border-color: var(--accent); }
  .link-content { flex: 1; min-width: 0; }
  .link-title {
    font-weight: 600;
    font-size: 0.9rem;
    margin-bottom: 2px;
    word-break: break-word;
  }
  .link-url {
    font-size: 0.78rem;
    color: var(--muted);
    word-break: break-all;
  }
  .link-url a {
    color: var(--accent);
    text-decoration: none;
  }
  .link-url a:hover { text-decoration: underline; }
  .link-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .link-actions button {
    border: 1px solid var(--border);
    border-radius: 4px;
    background: transparent;
    color: var(--muted);
    font-size: 0.72rem;
    padding: 4px 8px;
    cursor: pointer;
  }
  .link-actions button:hover { color: var(--danger); border-color: var(--danger); }

  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 40px 0;
  }
  .status-msg {
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
    padding: 8px 0;
  }
  .error-msg {
    color: var(--danger);
    font-size: 0.8rem;
    padding: 8px 12px;
    border: 1px solid var(--danger);
    border-radius: var(--radius);
    margin-bottom: 16px;
    background: var(--card-bg);
  }
</style>
</head>
<body>

<h1>网址储存</h1>

<details class="settings">
  <summary>设置 (首次使用请先填写 Token)</summary>
  <div class="settings-body">
    <label for="token">GitHub Personal Access Token</label>
    <input type="password" id="token" placeholder="ghp_xxxxxx" autocomplete="off">
    <p class="settings-hint">
      需要一个带 <strong>repo</strong> 权限的 Token。
      <a href="https://github.com/settings/tokens/new?scopes=repo&description=网址储存" target="_blank" rel="noopener">点这里创建</a>，
      创建后复制粘贴到上方。Token 只保存在你浏览器的 localStorage 中，不会上传到任何服务器。
    </p>
  </div>
</details>

<form class="add-form" id="addForm">
  <input type="text" id="urlInput" placeholder="粘贴网址，自动获取标题..." autocomplete="off">
  <button type="submit" id="addBtn">添加</button>
</form>

<div id="errorBox" class="error-msg" style="display:none;"></div>
<div id="status" class="status-msg" style="display:none;"></div>

<ul class="link-list" id="linkList"></ul>

<script>
(function () {
  "use strict";

  var OWNER = "xdd2024030565-spec";
  var REPO = "1";
  var BRANCH = "main";
  var FILE_PATH = "links.json";
  var API_BASE = "https://api.github.com";

  var tokenInput = document.getElementById("token");
  var addForm = document.getElementById("addForm");
  var urlInput = document.getElementById("urlInput");
  var addBtn = document.getElementById("addBtn");
  var linkList = document.getElementById("linkList");
  var statusEl = document.getElementById("status");
  var errorBox = document.getElementById("errorBox");

  var links = [];
  var fileSha = null;
  var busy = false;

  function getToken() { return localStorage.getItem("gh_token") || ""; }
  function saveToken(t) { localStorage.setItem("gh_token", t); }

  function ghRequest(method, path, body) {
    var token = getToken();
    var headers = { "Accept": "application/vnd.github.v3+json" };
    if (token) headers["Authorization"] = "token " + token;
    var opts = { method: method, headers: headers };
    if (body) opts.body = JSON.stringify(body);
    return fetch(API_BASE + path, opts).then(function (res) {
      if (!res.ok) {
        return res.json().catch(function () { return {}; }).then(function (err) {
          throw new Error(err.message || (res.status + " " + res.statusText));
        });
      }
      if (res.status === 204) return null;
      return res.json();
    });
  }

  function showError(msg) { errorBox.textContent = msg; errorBox.style.display = "block"; }
  function clearError() { errorBox.style.display = "none"; }
  function showStatus(msg) { statusEl.textContent = msg; statusEl.style.display = "block"; }
  function hideStatus() { statusEl.style.display = "none"; }

  function loadLinks() {
    if (!getToken()) { showError("请先在「设置」中填写 GitHub Token。"); return; }
    showStatus("加载中...");
    clearError();
    ghRequest("GET", "/repos/" + OWNER + "/" + REPO + "/contents/" + FILE_PATH + "?ref=" + BRANCH)
      .then(function (data) {
        fileSha = data.sha;
        if (data.content && data.encoding === "base64") {
          links = JSON.parse(atob(data.content.replace(/\n/g, "")));
        } else { links = []; }
        hideStatus();
        render();
      })
      .catch(function (err) {
        if (err.message && err.message.indexOf("404") !== -1) {
          links = []; fileSha = null; hideStatus(); render();
        } else { hideStatus(); showError("加载失败: " + err.message); }
      });
  }

  function saveLinks() {
    showStatus("保存中...");
    clearError();
    var content = btoa(unescape(encodeURIComponent(JSON.stringify(links, null, 2))));
    var body = { message: "更新网址储存", content: content, branch: BRANCH };
    if (fileSha) body.sha = fileSha;
    return ghRequest("PUT", "/repos/" + OWNER + "/" + REPO + "/contents/" + FILE_PATH, body)
      .then(function (data) { fileSha = data.content ? data.content.sha : fileSha; hideStatus(); })
      .catch(function (err) { hideStatus(); showError("保存失败: " + err.message); throw err; });
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function render() {
    if (links.length === 0) { linkList.innerHTML = '<li class="empty">还没有储存的网址</li>'; return; }
    var html = "";
    for (var i = 0; i < links.length; i++) {
      var item = links[i];
      var safeUrl = escapeHtml(item.url);
      var safeTitle = escapeHtml(item.title || item.url);
      html += '<li class="link-item"><div class="link-content">'
        + '<div class="link-title">' + safeTitle + '</div>'
        + '<div class="link-url"><a href="' + safeUrl + '" target="_blank" rel="noopener">' + safeUrl + '</a></div>'
        + '</div><div class="link-actions">'
        + '<button onclick="window._moveItem(' + i + ',-1)" title="上移">↑</button>'
        + '<button onclick="window._moveItem(' + i + ',1)" title="下移">↓</button>'
        + '<button onclick="window._deleteItem(' + i + ')" title="删除">删除</button>'
        + '</div></li>';
    }
    linkList.innerHTML = html;
  }

  function normalizeUrl(url) {
    url = url.trim();
    if (!url) return "";
    if (!/^https?:\/\//.test(url)) url = "https://" + url;
    return url;
  }

  function fetchTitle(url) {
    var proxyUrl = "https://corsproxy.io/?url=" + encodeURIComponent(url);
    return fetch(proxyUrl).then(function (res) { return res.text(); })
      .then(function (html) {
        var m = html.match(/<title[^>]*>([^<]*)<\/title>/i);
        return m ? m[1].trim() : "";
      }).catch(function () { return ""; });
  }

  window._deleteItem = function (idx) {
    if (busy) return;
    if (!confirm("确定删除这个网址吗?")) return;
    busy = true;
    links.splice(idx, 1);
    saveLinks().then(function () { render(); busy = false; }).catch(function () { busy = false; });
  };

  window._moveItem = function (idx, dir) {
    if (busy) return;
    var newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= links.length) return;
    busy = true;
    var tmp = links[idx]; links[idx] = links[newIdx]; links[newIdx] = tmp;
    saveLinks().then(function () { render(); busy = false; }).catch(function () { busy = false; });
  };

  addForm.addEventListener("submit", function (e) {
    e.preventDefault();
    if (busy) return;
    var rawUrl = urlInput.value.trim();
    if (!rawUrl) return;
    var url = normalizeUrl(rawUrl);
    if (!getToken()) { showError("请先在「设置」中填写 GitHub Token。"); return; }
    busy = true;
    addBtn.disabled = true;
    addBtn.textContent = "获取中...";
    showStatus("正在获取标题...");
    fetchTitle(url).then(function (title) {
      hideStatus();
      var entry = { url: url, title: title || url, added: new Date().toISOString() };
      links.unshift(entry);
      addBtn.textContent = "保存中...";
      return saveLinks().then(function () {
        render(); urlInput.value = ""; addBtn.textContent = "添加"; addBtn.disabled = false; busy = false;
      });
    }).catch(function () {
      hideStatus(); addBtn.textContent = "添加"; addBtn.disabled = false; busy = false;
    });
  });

  tokenInput.value = getToken();
  tokenInput.addEventListener("change", function () { saveToken(tokenInput.value.trim()); loadLinks(); });

  if (getToken()) { loadLinks(); }
  else { linkList.innerHTML = '<li class="empty">请先在「设置」中填写 GitHub Token</li>'; }
})();
</script>

</body>
</html>
